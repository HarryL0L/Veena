[package]
name = "veena"
description = "Veena music player for Linux"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
veena-core = { path = "../../crates/veena-core" }
veena-player = { path = "../../crates/veena-player" }
veena-plugin = { path = "../../crates/veena-plugin" }
veena-src-local = { path = "../../crates/veena-src-local" }
anyhow = "1.0.104"
clap = { version = "4.6.9", features = ["derive", "env"] }
crossterm = "0.29.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal", "sync"] }
