name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install system headers
        # ALSA for audio; fontconfig and xkbcommon for the desktop app's UI.
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libfontconfig1-dev libxkbcommon-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  android:
    name: Android app (APK)
    runs-on: ubuntu-latest
    # One Android build per branch at a time; a newer push replaces an older
    # build, so two builds never race to publish the nightly.
    concurrency:
      group: android-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-ndk and ALSA headers
        # The bindings generator runs on the build machine and links its audio library.
        run: |
          sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
          cargo install --locked cargo-ndk
      - name: Build the Rust core and Kotlin bindings
        # Phones (arm64) and emulators (x86_64).
        run: ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" ABIS="arm64-v8a x86_64" apps/android/build-rust.sh
      - name: Unpack the signing key
        # From the repository's secrets; without them the APK uses a debug key.
        env:
          KEYSTORE_BASE64: ${{ secrets.VEENA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/veena-release.jks"
            echo "VEENA_KEYSTORE=$RUNNER_TEMP/veena-release.jks" >> "$GITHUB_ENV"
          else
            echo "No signing key in secrets; using the debug key."
          fi
      - name: Build the APK
        working-directory: apps/android
        env:
          VEENA_KEYSTORE_PASSWORD: ${{ secrets.VEENA_KEYSTORE_PASSWORD }}
          VEENA_KEY_ALIAS: ${{ secrets.VEENA_KEY_ALIAS }}
          VEENA_KEY_PASSWORD: ${{ secrets.VEENA_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --warning-mode all assembleRelease
      - name: Name the APKs
        run: |
          out=apps/android/app/build/outputs/apk/release
          mkdir -p dist
          cp "$out/app-arm64-v8a-release.apk" dist/veena-arm64.apk
          cp "$out/app-x86_64-release.apk" dist/veena-x86_64.apk
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: veena-apk
          path: dist/*.apk

  linux:
    name: Linux app (${{ matrix.arch }})
    # Built natively on each architecture, on the oldest supported runner so
    # the download runs on older distros too.
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    concurrency:
      group: linux-${{ matrix.arch }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - name: Install system headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libfontconfig1-dev libxkbcommon-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build and package
        run: apps/desktop/package/build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: veena-linux-${{ matrix.arch }}
          path: dist/*.tar.gz

  nightly:
    name: Publish the nightly pre-release
    # One pre-release named "nightly", replaced by every push to main, so
    # the newest build always has the same download page. Other branches
    # are built and tested but never replace it.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [android, linux]
    runs-on: ubuntu-latest
    concurrency:
      group: nightly
      cancel-in-progress: true
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          ls -l dist
          gh release delete nightly --yes --cleanup-tag || true
          {
            printf 'Built from %s.\n\n%s\n\n' "${GITHUB_SHA::7}" "$(printf '%s' "$MESSAGE" | head -1)"
            printf -- '- **Phone:** veena-arm64.apk (the x86_64 one is for emulators)\n'
            printf -- '- **Linux:** veena-music-linux-x86_64.tar.gz (most PCs) or veena-music-linux-aarch64.tar.gz (ARM: Raspberry Pi, Asahi, ARM laptops). Unpack, then run ./install.sh\n'
          } > notes.md
          gh release create nightly dist/* --prerelease --title "Nightly build" \
            --notes-file notes.md --target "$GITHUB_SHA"

  dependencies:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
