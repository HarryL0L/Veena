name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install system headers
        # ALSA for audio; fontconfig and xkbcommon for the desktop app's UI.
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libfontconfig1-dev libxkbcommon-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  android:
    name: Android app (APK)
    runs-on: ubuntu-latest
    permissions:
      # Publishes the nightly pre-release on pushes.
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-ndk and ALSA headers
        # The bindings generator runs on the build machine and links its audio library.
        run: |
          sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
          cargo install --locked cargo-ndk
      - name: Build the Rust core and Kotlin bindings
        # Phones (arm64) and emulators (x86_64).
        run: ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" ABIS="arm64-v8a x86_64" apps/android/build-rust.sh
      - name: Build the APK
        working-directory: apps/android
        run: ./gradlew --no-daemon --warning-mode all assembleRelease
      - name: Name the APKs
        run: |
          out=apps/android/app/build/outputs/apk/release
          mkdir -p dist
          cp "$out/app-arm64-v8a-release.apk" dist/veena-phone-arm64.apk
          cp "$out/app-x86_64-release.apk" dist/veena-emulator-x86_64.apk
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: veena-apk
          path: dist/*.apk
      - name: Publish the nightly pre-release
        # One pre-release named "nightly", replaced by every push, so the
        # newest build always has the same download page.
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          gh release delete nightly --yes --cleanup-tag || true
          printf 'Built from %s on branch %s.\n\n%s\n\nInstall **veena-phone-arm64.apk** on a phone. The x86_64 file is for emulators.\n' \
            "${GITHUB_SHA::7}" "$GITHUB_REF_NAME" "$(printf '%s' "$MESSAGE" | head -1)" > notes.md
          gh release create nightly dist/*.apk --prerelease --title "Nightly build" \
            --notes-file notes.md --target "$GITHUB_SHA"

  dependencies:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
