[package]
name = "veena-plugin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
veena-core = { path = "../veena-core" }
veena-net = { path = "../veena-net" }
# `jsvalue-enum`: the default NaN-boxed values assume untagged pointers,
# which breaks on Android (ARM64 tags heap pointers). Enabled everywhere so
# every platform runs the same code.
boa_engine = { version = "0.22.0", features = ["jsvalue-enum"] }
log = "0.4.35"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["sync", "time"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
