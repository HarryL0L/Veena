[package]
name = "veena-plugin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
veena-core = { path = "../veena-core" }
veena-net = { path = "../veena-net" }
boa_engine = "0.21.1"
log = "0.4.35"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["sync", "time"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
