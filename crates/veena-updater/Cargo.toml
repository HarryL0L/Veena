[package]
name = "veena-updater"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
veena-core = { path = "../veena-core" }
veena-net = { path = "../veena-net" }
veena-plugin = { path = "../veena-plugin" }
base64 = "0.23.1"
ed25519-dalek = "3.0.0"
getrandom = "0.4.3"
log = "0.4.35"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "sync"] }

[dev-dependencies]
ed25519-dalek = "3.0.0"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
